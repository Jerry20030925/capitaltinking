name: trade

# The 24/7 loop now runs on Fly.io (see fly.toml). The scheduled cron is
# DISABLED so the two don't trade the same demo account at once (double-trading).
# Kept as manual-only for one-off cycles from the Actions tab.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 */2 * * *"   # disabled — Fly.io runs the loop 24/7

concurrency:
  group: trade
  cancel-in-progress: false

# The workflow commits the updated trade ledger back to the repo.
permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # --- non-secret config (safe to keep in the repo) ---
      TRADING_MODE: demo
      DRY_RUN: "false"
      DEEPSEEK_MODEL: deepseek-reasoner
      ALLOWED_EPICS: GOLD,SILVER,US500,OIL_CRUDE,BTCUSD,EURUSD
      MAX_POSITION_SIZE: "1000"
      MAX_OPEN_POSITIONS: "3"
      MIN_ACCOUNT_BALANCE: "100"
      STOP_LOSS_PCT: "2"
      TAKE_PROFIT_PCT: "4"
      MIN_CONFIDENCE: "0.6"
      # Risk-budget engine: cap loss-per-trade + circuit breakers (auto-halt).
      RISK_PER_TRADE_PCT: "0.5"
      MAX_DAILY_LOSS_PCT: "2"
      MAX_WEEKLY_LOSS_PCT: "5"
      MAX_DRAWDOWN_PCT: "10"
      # Devil's Advocate: start in observe (record vetoes, don't block) to A/B it.
      DEVIL_ADVOCATE: "true"
      DEVIL_MODE: observe
      DYNAMIC_SIZING: "true"
      USE_TRAILING_STOP: "true"
      TREND_DAYS: "7"
      NOTIFY_ON: all
      # --- secrets (set with: gh secret set) ---
      CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
      CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
      CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the commit-back rebase stays clean
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run once
      # Persist the append-only trade ledger so analytics survive across runs.
      # The concurrency group above serialises cycles, so pushes don't collide.
      - name: Commit trade ledger
        if: always()
        run: |
          if git diff --quiet -- trades.log.jsonl; then
            echo "Ledger unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "capitaltinking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trades.log.jsonl
          git commit -m "ledger: trade cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push
