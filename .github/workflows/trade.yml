name: trade

# Runs one decide-and-trade cycle every hour, in GitHub's cloud — keeps
# running even when your computer is off. Times are UTC.
on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours (UTC) — stays within Actions free tier
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # --- non-secret config (safe to keep in the repo) ---
      TRADING_MODE: demo
      DRY_RUN: "false"
      DEEPSEEK_MODEL: deepseek-reasoner
      ALLOWED_EPICS: GOLD,SILVER,US500,OIL_CRUDE,BTCUSD,EURUSD
      MAX_POSITION_SIZE: "1000"
      MAX_OPEN_POSITIONS: "3"
      MIN_ACCOUNT_BALANCE: "100"
      EXPOSURE_PER_TRADE_PCT: "20"
      STOP_LOSS_PCT: "2"
      TAKE_PROFIT_PCT: "4"
      MIN_CONFIDENCE: "0.6"
      DYNAMIC_SIZING: "true"
      USE_TRAILING_STOP: "true"
      TREND_DAYS: "7"
      NOTIFY_ON: all
      # --- secrets (set with: gh secret set) ---
      CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
      CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
      CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run once
