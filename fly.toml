# Fly.io config for the 24/7 capitaltinking loop.
# App name is GLOBAL on Fly — if "capitaltinking" is taken, change it here and in
# the `fly apps create` command. This is a worker (no HTTP service), so it runs
# one always-on machine that executes `npm run loop`.
app = "capitaltinking"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Non-secret config. SECRETS (API keys/tokens) go via `fly secrets set`, never here.
[env]
  TZ = "Australia/Sydney"          # daily report + daily-loss window use local time
  LEDGER_DIR = "/data"             # persistent volume (see [mounts])
  LOOP_INTERVAL_MINUTES = "15"     # one decide-and-trade cycle every 15 min

  TRADING_MODE = "demo"
  DRY_RUN = "false"
  DEEPSEEK_MODEL = "deepseek-reasoner"
  # Second brain (Qwen) — non-secrets here; QWEN_API_KEY via `fly secrets set`.
  QWEN_BASE_URL = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
  QWEN_MODEL = "qwen-plus"
  # OR-logic: trade if EITHER brain sees an opportunity (no need for both to agree).
  SECOND_BRAIN_MODE = "either"
  ALLOWED_EPICS = "GOLD,SILVER,US500,OIL_CRUDE,BTCUSD,EURUSD"

  # Position sizing: deploy a real slice of available funds per trade (not a token
  # lot). No hard lot ceiling — capital-% + the per-trade loss cap size each trade.
  # Dynamic risk-based sizing: RISK (0.5–1.5%/trade, scaled by signal strength,
  # hard-capped 2%) is the control; capital % is only a utilisation ceiling.
  SIZING_MODE = "capital"
  CAPITAL_DEPLOY_PCT = "100"   # may use up to 100% of available margin — NOT a loss limit
  TARGET_RISK_MIN_PCT = "0.6"
  TARGET_RISK_MAX_PCT = "2.0"  # bold: strongest signals bet the full per-trade ceiling
  MAX_TRADE_LOSS_PCT = "2"     # absolute per-trade risk ceiling (unchanged — the backstop)
  MAX_POSITION_SIZE = "0"
  # Fund more of the promising ideas at once → deploy more of the available funds.
  MAX_OPEN_POSITIONS = "5"
  MIN_ACCOUNT_BALANCE = "100"
  STOP_LOSS_PCT = "2"
  TAKE_PROFIT_PCT = "4"
  MIN_CONFIDENCE = "0.55"  # bolder: act on more genuine signals (more buy/sell)
  # Composite opportunity score (0-100) gate: below this = no edge = no trade.
  # Above it, position size scales with the score (only high-quality = big size).
  MIN_SIGNAL_SCORE = "50"  # bolder entry bar; size still tracks score, big only if strong
  # Expected-Value gate: once a setup has ≥ MIN_EV_SAMPLE realised trades, block it
  # if its measured expectancy (avg R) < MIN_EV_R. Stops feeding a losing playbook.
  MIN_EV_SAMPLE = "8"
  MIN_EV_R = "0"

  # Circuit breakers (portfolio-level guard — always on)
  RISK_PER_TRADE_PCT = "0.5"
  MAX_DAILY_LOSS_PCT = "3"
  MAX_WEEKLY_LOSS_PCT = "7"
  MAX_DRAWDOWN_PCT = "10"
  MAX_CONSECUTIVE_LOSSES = "4"
  # Portfolio-heat / correlation caps: bound AGGREGATE and per-theme open risk so
  # the book can't concentrate into one correlated bet. 0 disables a cap.
  MAX_PORTFOLIO_HEAT_PCT = "10"
  MAX_GROUP_HEAT_PCT = "6"
  # Edge-scaled sizing (fractional Kelly): press setups with a proven +EV edge.
  EDGE_SIZING = "true"
  KELLY_FRACTION = "0.34"
  EDGE_MAX_MULT = "2.5"

  DYNAMIC_SIZING = "true"
  USE_TRAILING_STOP = "true"
  # Partial profit-taking: bank pieces as a winner runs, trail the rest.
  # "profit%:close%-of-original" tiers; remainder rides the trailing stop.
  PARTIAL_TP = "true"
  PARTIAL_TP_TIERS = "1:20,2:30,3:20"
  # Let winners run: with a trailing stop, don't cap the remainder at a fixed TP —
  # the trail is the exit, so a trending winner rides the whole move (scale-outs
  # bank guaranteed profit along the way). This is the big-win/right-tail engine.
  TRAILING_TAKE_PROFIT = "false"
  TREND_DAYS = "7"

  # Devil's Advocate — start in observe (record vetoes, don't block) to A/B it.
  DEVIL_ADVOCATE = "true"
  DEVIL_MODE = "observe"

  # Only push on real actions (opens/closes); pure-HOLD cycles stay quiet. Messages
  # are BATCHED and sent at most once every 2h (a heartbeat goes out if idle).
  NOTIFY_ON = "actions"
  NOTIFY_INTERVAL_MINUTES = "120"

# Persistent disk for the trade ledger, so analytics survive restarts/deploys.
[mounts]
  source = "ledger"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
